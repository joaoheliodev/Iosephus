name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      # Actions fixadas por commit: uma tag pode ser movida para código malicioso
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Banco de teste (schema, GRANTs e seed do repositório)
        run: |
          printf '[client]\nhost=127.0.0.1\nuser=root\npassword=root\n' > ~/.my.cnf
          MYSQL_APP_PASSWORD=teste ./scripts/criar_banco_teste.sh
      - name: Testes
        working-directory: api
        env:
          IOSEPHUS_TESTE_MYSQL: "1"
        run: |
          pip install -r requirements-dev.txt
          pytest -q
